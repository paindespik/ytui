[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytui-server"
version = "0.2.0"
description = "ytui backend: FastAPI server for feed, search, streams, history and playlists"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2024.10.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anyio>=4.0",
    "websockets>=12",
]

[project.optional-dependencies]
auth = [
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["ytui_server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the historical default rule set so an unpinned ruff upgrade (e.g. 0.16
# expanding its stable defaults) can't turn CI red on untouched code.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
