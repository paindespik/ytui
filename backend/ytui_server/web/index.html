<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101014">
  <title>ytui</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <nav class="sidebar" id="sidebar" aria-label="Navigation">
      <a class="brand" href="#/">
        <img src="icon.svg" alt="" width="28" height="28">
        <span class="nav-label">ytui</span>
      </a>
      <a href="#/" data-nav="/" data-icon="house" aria-label="Accueil"><span class="nav-label">Accueil</span></a>
      <a href="#/suggestions" data-nav="/suggestions" data-icon="sparkles" aria-label="Suggestions"><span class="nav-label">Suggestions</span></a>
      <a href="#/music" data-nav="/music" data-icon="music" aria-label="Musique"><span class="nav-label">Musique</span></a>
      <a href="#/search" data-nav="/search" data-icon="search" aria-label="Recherche"><span class="nav-label">Recherche</span></a>
      <a href="#/lives" data-nav="/lives" data-icon="radio" aria-label="Lives"><span class="nav-label">Lives</span><span class="nav-badge" id="live-count" hidden></span></a>
      <a href="#/history" data-nav="/history" data-icon="history" aria-label="Historique"><span class="nav-label">Historique</span></a>
      <a href="#/playlists" data-nav="/playlists" data-icon="list-video" aria-label="Playlists"><span class="nav-label">Playlists</span></a>
      <a href="#/settings" data-nav="/settings" data-icon="settings" aria-label="Réglages"><span class="nav-label">Réglages</span></a>
      <button class="nav-help" id="nav-help" data-icon="circle-help" title="Raccourcis clavier (?)"><span class="nav-label">Aide</span></button>
    </nav>
    <div class="main">
      <header class="topbar">
        <a class="topbar-brand" href="#/" aria-label="ytui — accueil">
          <img src="icon.svg" alt="" width="28" height="28">
        </a>
        <form class="topsearch" id="topsearch" role="search">
          <input class="input" id="search-input" type="search" placeholder="Rechercher…"
                 aria-label="Rechercher" autocomplete="off" enterkeyhint="search">
          <button class="btn icon" type="submit" data-icon="search" title="Rechercher" aria-label="Rechercher"></button>
        </form>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>
  <div id="modal-root"></div>
  <script src="vendor/hls.min.js"></script>
  <script src="vendor/dash.all.min.js"></script>
  <script src="vendor/mpegts.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
