[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytui"
version = "0.1.0"
description = "A terminal YouTube client: channel feed via RSS, search via yt-dlp, playback via mpv"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=0.80",
    "textual-image>=0.8",
    "yt-dlp>=2024.10.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "platformdirs>=4.0",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
auth = [
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
ytui = "ytui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ytui"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
