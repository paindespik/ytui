name: ytui_mobile
description: "ytui Android client — feed, search and playback through the ytui backend."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.9.0
  flutter_foreground_task: ^9.2.2
  shared_preferences: ^2.3.4
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
