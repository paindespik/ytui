# Template: replace ytui.example.com with your own domain before installing.
# ytui.example.com → ytui backend (docker, loopback 8776)
server {
    listen 80;
    listen [::]:80;
    server_name ytui.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ytui.example.com;

    ssl_certificate     /etc/letsencrypt/live/ytui.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ytui.example.com/privkey.pem;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8776;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;   # yt-dlp resolution can be slow
        proxy_send_timeout 120s;
    }
}
