name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend-tests:
    runs-on: docker
    container:
      image: python:3.13-bookworm
    steps:
      # 'node' is required by the JS actions (checkout, upload-artifact)
      - name: Install node
        run: apt-get update -qq && apt-get install -y -qq nodejs

      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install
        run: |
          pip install -e ./backend[dev]
          pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: Backend tests
        run: cd backend && pytest

      - name: TUI client tests
        run: pytest tests

  build-apk:
    runs-on: docker
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    steps:
      - name: Install node
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nodejs || (apt-get update -qq && apt-get install -y -qq nodejs)

      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Analyze & test
        run: |
          cd mobile
          flutter pub get
          flutter analyze
          flutter test

      - name: Set up release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > mobile/android/ytui-release.jks
            printf 'storeFile=ytui-release.jks\nstorePassword=%s\nkeyAlias=ytui\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > mobile/android/key.properties
            echo "Release keystore configured."
          else
            echo "No keystore secret; falling back to debug signing."
          fi

      - name: Build APK
        run: cd mobile && flutter build apk --release

      - name: Upload APK artifact
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: ytui-app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  deploy:
    needs: [backend-tests]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: docker
    steps:
      - name: Install ssh client
        run: |
          apt-get update -qq
          apt-get install -y -qq openssh-client

      - name: Deploy to server
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'bash ~/ytui-deploy/deploy/deploy.sh'
